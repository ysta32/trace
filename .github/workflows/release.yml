name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: npm i -g wasm-pack
      - run: npm ci
      - run: npm run build:wasm
      - run: npm run build -w trace-vectorizer
      - name: Pack package
        working-directory: packages/trace-vectorizer
        run: |
          mkdir -p "$RUNNER_TEMP/trace-release"
          npm pack --pack-destination "$RUNNER_TEMP/trace-release"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v version="${TAG_NAME#v}" -v tag="$TAG_NAME" '
            $1 == "##" {
              if (found) exit
              if ($2 == "[" version "]" || $2 == "[" tag "]") {
                found = 1
                next
              }
            }
            found { print }
          ' CHANGELOG.md > "$notes"
          if grep -q '[^[:space:]]' "$notes"; then
            gh release create "$TAG_NAME" "$RUNNER_TEMP"/trace-release/*.tgz --verify-tag --notes-file "$notes"
          else
            gh release create "$TAG_NAME" "$RUNNER_TEMP"/trace-release/*.tgz --verify-tag --generate-notes
          fi
      - name: Publish to npm when configured
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm publish "$RUNNER_TEMP"/trace-release/*.tgz --access public
          fi
